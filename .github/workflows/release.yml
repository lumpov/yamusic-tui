name: release

permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
  RELEASE_MAKE_LATEST: ${{ !contains(github.ref_name, '-') }}

jobs:
  build:
    name: Release binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install build dependencies
      run: sudo apt install -y libx11-dev libasound2-dev
    - name: Setup Go
      uses: actions/setup-go@v5

    - name: Download dependencies
      run: go mod vendor
    - name: Pack vendor dir
      run: tar -czf yamusic-tui-vendor.tar.gz ./vendor
    - name: Upload vendor archive
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic-tui-vendor.tar.gz
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}

    - name: Build linux-amd64
      run: go build -trimpath -ldflags="-w -s -X github.com/dece2183/yamusic-tui/config.Version=${{ github.ref_name }}" -o yamusic
      env:
        GOOS: linux
        GOARCH: amd64
    - name: Upload linux-amd64
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}

    - name: Build linux-amd64-nomedia
      run: go build -trimpath -ldflags="-w -s -X github.com/dece2183/yamusic-tui/config.Version=${{ github.ref_name }}" -tags=nomedia -o yamusic-nomedia
      env:
        GOOS: linux
        GOARCH: amd64
    - name: Upload linux-amd64-nomedia
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic-nomedia
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}

    - name: Build windows-amd64
      run: go build -trimpath -ldflags="-w -s -X github.com/dece2183/yamusic-tui/config.Version=${{ github.ref_name }}" -o yamusic.exe
      env:
        GOOS: windows
        GOARCH: amd64
    - name: Upload windows-amd64
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic.exe
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}

    - name: Build windows-amd64-nomedia
      run: go build -trimpath -ldflags="-w -s -X github.com/dece2183/yamusic-tui/config.Version=${{ github.ref_name }}" -tags=nomedia -o yamusic-nomedia.exe
      env:
        GOOS: windows
        GOARCH: amd64
    - name: Upload windows-amd64
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic-nomedia.exe
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}

  macos:
    name: Release darwin-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            goarch: arm64
          - runner: macos-15-intel
            goarch: amd64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build darwin-${{ matrix.goarch }}
      run: go build -trimpath -ldflags="-w -s -linkmode=external -X github.com/dece2183/yamusic-tui/config.Version=${{ github.ref_name }}" -o yamusic-darwin-${{ matrix.goarch }}
      env:
        CGO_ENABLED: "1"
        GOOS: darwin
        GOARCH: ${{ matrix.goarch }}
    - name: Upload darwin-${{ matrix.goarch }}
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic-darwin-${{ matrix.goarch }}
        asset_name: yamusic-darwin-${{ matrix.goarch }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}

    - name: Build darwin-${{ matrix.goarch }}-nomedia
      run: go build -trimpath -ldflags="-w -s -linkmode=external -X github.com/dece2183/yamusic-tui/config.Version=${{ github.ref_name }}" -tags=nomedia -o yamusic-darwin-${{ matrix.goarch }}-nomedia
      env:
        CGO_ENABLED: "1"
        GOOS: darwin
        GOARCH: ${{ matrix.goarch }}
    - name: Upload darwin-${{ matrix.goarch }}-nomedia
      uses: svenstaro/upload-release-action@v2
      with:
        file: yamusic-darwin-${{ matrix.goarch }}-nomedia
        asset_name: yamusic-darwin-${{ matrix.goarch }}-nomedia
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        make_latest: ${{ env.RELEASE_MAKE_LATEST }}
        target_commit: ${{ github.sha }}
